name: CI

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopenblas-dev

      - name: Configure project
        run: |
          cmake -S OpenBLAS_perf -B build

      - name: Build project
        run: |
          cmake --build build

      - name: Run benchmark
        run: |
          ./build/benchmark